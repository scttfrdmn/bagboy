# Example: Multi-format VM builds
name: myapp
version: 1.0.0
description: My awesome application
homepage: https://myapp.com
license: MIT
author: Your Name <you@example.com>

binaries:
  linux-amd64: dist/myapp-linux-amd64
  darwin-amd64: dist/myapp-darwin-amd64

# Enable VM support for cross-platform builds
vm:
  enabled: true
  provider: docker

packages:
  # RPM - uses Fedora container
  rpm:
    vendor: "Your Company"
    group: "Applications/System"
  
  # DEB - uses Ubuntu container
  deb:
    maintainer: "you@example.com"
    section: "utils"
    priority: "optional"
  
  # Homebrew - builds natively on macOS
  brew:
    test: |
      system "#{bin}/myapp --version"
